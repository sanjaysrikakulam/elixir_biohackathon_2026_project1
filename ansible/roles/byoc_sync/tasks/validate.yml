---
# Stop before any change when a value is missing, empty or still "changeme", or when the user or group does not
# exist.

- name: Check the true/false switches
  ansible.builtin.fail:
    msg: "{{ item }} must be true or false, got {{ lookup('ansible.builtin.vars', item, default=None) | to_json }}"
  loop: [byoc_sync_dry_run, byoc_sync_allow_delete, byoc_sync_cron_enabled, byoc_sync_manage_packages,
         byoc_sync_install_tpv]
  vars:
    _value: "{{ lookup('ansible.builtin.vars', item, default=None) }}"
  when: >-
    not (_value is boolean
         or (_value is string and (_value | lower) in ['true', 'false', 'yes', 'no']))

- name: Work out which values this configuration needs
  ansible.builtin.set_fact:
    _byoc_sync_required: >-
      {{ _byoc_sync_install_required + (_byoc_sync_run_required if byoc_sync_cron_enabled | bool else []) }}
    _byoc_sync_missing: []

- name: Find values that are missing, empty or 'changeme'
  ansible.builtin.set_fact:
    _byoc_sync_missing: "{{ _byoc_sync_missing + [item] }}"
  loop: "{{ _byoc_sync_required }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _value: "{{ lookup('ansible.builtin.vars', item, default=None) }}"
  when: >-
    _value is none
    or (_value | string | trim | regex_replace('^[\"\']+|[\"\']+$', '') | trim | lower) in ['', 'changeme']

- name: Stop when values are missing
  ansible.builtin.fail:
    msg: "byoc_sync: set these variables (they are missing, empty or 'changeme'): {{ _byoc_sync_missing | join(', ') }}"
  when: _byoc_sync_missing | length > 0

- name: Check that required values are text
  ansible.builtin.fail:
    msg: "{{ item }} must be text; quote it in YAML"
  loop: "{{ _byoc_sync_required }}"
  loop_control:
    label: "{{ item }}"
  when: lookup('ansible.builtin.vars', item) is not string

- name: Check that optional values are text
  ansible.builtin.fail:
    msg: "{{ item }} must be text; quote it in YAML"
  loop: [byoc_sync_playbook_repo_url, byoc_sync_galaxy_url, byoc_sync_galaxy_api_key, byoc_sync_github_repo,
         byoc_sync_github_token, byoc_sync_fingerprint_key, byoc_sync_gxadmin_cmd, byoc_sync_site_config]
  loop_control:
    label: "{{ item }}"
  vars:
    _value: "{{ lookup('ansible.builtin.vars', item, default=None) }}"
  when: _value is not none and _value is not string

- name: Check the folders are absolute paths
  ansible.builtin.fail:
    msg: "{{ item }} must be an absolute path, got '{{ lookup('ansible.builtin.vars', item) }}'"
  loop: [byoc_sync_venv, byoc_sync_src_dir, byoc_sync_reports_dir, byoc_sync_work_dir, byoc_sync_config_dir,
         byoc_sync_wrapper_path]
  when: >-
    lookup('ansible.builtin.vars', item) is not string
    or not lookup('ansible.builtin.vars', item).startswith('/')

- name: Check the virtualenv and the source are separate folders
  ansible.builtin.fail:
    msg: byoc_sync_venv and byoc_sync_src_dir must be separate folders, neither inside the other
  vars:
    _venv: "{{ byoc_sync_venv | regex_replace('/+$', '') }}"
    _src: "{{ byoc_sync_src_dir | regex_replace('/+$', '') }}"
  when: _venv == _src or _venv.startswith(_src ~ '/') or _src.startswith(_venv ~ '/')

- name: Check repository URLs carry no password
  ansible.builtin.fail:
    msg: "{{ item }} must not contain a password (it would be visible in the wrapper and in ps)"
  loop: [byoc_sync_repo_url, byoc_sync_playbook_repo_url]
  # user:password@ in any URL, or any user@ in an http(s) URL (a token as the user name).
  when: >-
    lookup('ansible.builtin.vars', item) | string is regex('^[A-Za-z][A-Za-z0-9+.-]*://[^/@:]+:[^/@]*@')
    or lookup('ansible.builtin.vars', item) | string is regex('^https?://[^/@]+@')

- name: Check the data source
  ansible.builtin.fail:
    msg: "byoc_sync_source must be api or gxadmin, got '{{ byoc_sync_source }}'"
  when: byoc_sync_source not in ['api', 'gxadmin']

- name: Check the user and group are names
  # getent finds a number as an ID but reports the entry under its name; cron and become_user need the name.
  ansible.builtin.fail:
    msg: "{{ item }} must be a name, not a number ({{ lookup('ansible.builtin.vars', item) }})"
  loop: [byoc_sync_user, byoc_sync_group]
  when: lookup('ansible.builtin.vars', item) is regex('^[0-9]+$')

- name: Look up the system user
  ansible.builtin.getent:
    database: passwd
    key: "{{ byoc_sync_user }}"
    fail_key: false

- name: Stop when the system user does not exist
  ansible.builtin.fail:
    msg: "system user '{{ byoc_sync_user }}' does not exist on {{ inventory_hostname }}; create it first"
  when: ansible_facts['getent_passwd'][byoc_sync_user] is none

- name: Look up the system group
  ansible.builtin.getent:
    database: group
    key: "{{ byoc_sync_group }}"
    fail_key: false

- name: Stop when the system group does not exist
  ansible.builtin.fail:
    msg: "system group '{{ byoc_sync_group }}' does not exist on {{ inventory_hostname }}; create it first"
  when: ansible_facts['getent_group'][byoc_sync_group] is none

- name: Check a site config file
  # byoc-sync reads a value with a file suffix as a file and anything else as a bundled site name.
  when: (byoc_sync_site_config | string | basename | splitext | last) != ''
  block:
    - name: Stop when the site config file is not an absolute path
      ansible.builtin.fail:
        msg: >-
          byoc_sync_site_config: {{ byoc_sync_site_config }} must be an absolute path
          (a value with a file suffix is read as a file)
      when: not (byoc_sync_site_config | string).startswith('/')

    - name: Look for the site config file
      ansible.builtin.stat:
        path: "{{ byoc_sync_site_config }}"
      register: _byoc_sync_site_stat

    - name: Stop when the site config file is missing
      ansible.builtin.fail:
        msg: "byoc_sync_site_config: {{ byoc_sync_site_config }} does not exist on {{ inventory_hostname }}"
      when: not _byoc_sync_site_stat.stat.exists

- name: Check the vault password has no outer whitespace
  ansible.builtin.fail:
    msg: "byoc_sync_vault_password must not start or end with whitespace (byoc-sync strips it)"
  when: (byoc_sync_vault_password | string) != (byoc_sync_vault_password | string | trim)

- name: Check extra environment variable values
  ansible.builtin.fail:
    msg: "byoc_sync_extra_env: the value of '{{ item.key }}' must be text or a number"
  loop: "{{ byoc_sync_extra_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: false
  when: not ((item.value is string or item.value is number) and item.value is not boolean)

- name: Check extra environment variable names
  ansible.builtin.fail:
    msg: "byoc_sync_extra_env: '{{ item }}' cannot be used as an environment variable name"
  loop: "{{ byoc_sync_extra_env.keys() | list }}"
  when: >-
    item is not regex('^[A-Za-z_][A-Za-z0-9_]*$')
    or item in _byoc_sync_reserved_env
    or item is regex('^(LD_|PYTHON)')

- name: Check cron paths
  ansible.builtin.fail:
    msg: "{{ item }} must not contain '%' when cron is on (cron treats it as a newline)"
  loop: [byoc_sync_reports_dir, byoc_sync_wrapper_path]
  when: byoc_sync_cron_enabled | bool and '%' in lookup('ansible.builtin.vars', item)
