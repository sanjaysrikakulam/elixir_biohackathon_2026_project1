---
# Folders for reports and the playbook clone, then the secret files and the wrapper.

- name: Create the reports and work folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ _byoc_sync_file_owner }}"
    group: "{{ byoc_sync_group }}"
    mode: "2750"
  loop:
    - "{{ byoc_sync_reports_dir }}"
    - "{{ byoc_sync_work_dir }}"

- name: Write the secret files and the wrapper
  ansible.builtin.import_tasks: render.yml
