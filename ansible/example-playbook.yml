---
# Example: install byoc-sync on the hosts in the "byoc_sync" inventory group.
#   ansible-playbook -i inventory example-playbook.yml --ask-vault-pass
# Replace every value below. Keep secrets in Ansible Vault, e.g.
#   ansible-vault encrypt_string --name vault_byoc_sync_vault_password 'the-playbook-vault-password'
# and read roles/byoc_sync/defaults/main.yml for every other option.
- name: Install and configure byoc-sync
  hosts: byoc_sync
  become: true
  vars:
    # Always required.
    byoc_sync_user: byoc-sync  # must already exist on the host
    byoc_sync_group: byoc-sync  # must already exist on the host
    byoc_sync_repo_url: https://github.com/<you>/byoc-sync.git
    byoc_sync_venv: /opt/byoc-sync/venv
    byoc_sync_reports_dir: /var/lib/byoc-sync
    byoc_sync_vault_password: "{{ vault_byoc_sync_vault_password }}"
    # Needed to run byoc-sync (by hand or from cron).
    byoc_sync_playbook_repo_url: https://github.com/<you>/infrastructure-playbook.git
    byoc_sync_galaxy_url: https://galaxy.example.org
    byoc_sync_galaxy_api_key: "{{ vault_byoc_sync_galaxy_api_key }}"
    byoc_sync_site_config: eu  # usegalaxy.eu's layout; other sites point to their own site YAML
    byoc_sync_fingerprint_key: "{{ vault_byoc_sync_fingerprint_key }}"
    # Publishing pull requests: switch dry-run off only after the reports look right.
    byoc_sync_dry_run: true
    # byoc_sync_github_repo: <you>/infrastructure-playbook
    # byoc_sync_github_token: "{{ vault_byoc_sync_github_token }}"
    # Daily at midnight.
    byoc_sync_cron_enabled: false
  roles:
    - byoc_sync
