---
# The secret files and the wrapper. Secret tasks never log or diff their content.

- name: Create the folder for the secret files
  ansible.builtin.file:
    path: "{{ byoc_sync_config_dir }}"
    state: directory
    owner: "{{ _byoc_sync_file_owner }}"
    group: "{{ byoc_sync_group }}"
    mode: "2700"

- name: Write the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ byoc_sync_config_dir }}/env"
    owner: "{{ _byoc_sync_file_owner }}"
    group: "{{ byoc_sync_group }}"
    mode: "0600"
  no_log: true
  diff: false

- name: Write the vault password file
  ansible.builtin.copy:
    content: "{{ byoc_sync_vault_password }}\n"
    dest: "{{ byoc_sync_config_dir }}/vault-password"
    owner: "{{ _byoc_sync_file_owner }}"
    group: "{{ byoc_sync_group }}"
    mode: "0600"
  no_log: true
  diff: false

- name: Install the byoc-sync-run wrapper
  ansible.builtin.template:
    src: byoc-sync-run.sh.j2
    dest: "{{ byoc_sync_wrapper_path }}"
    owner: "{{ _byoc_sync_wrapper_owner }}"
    group: "{{ _byoc_sync_wrapper_group }}"
    mode: "0755"
