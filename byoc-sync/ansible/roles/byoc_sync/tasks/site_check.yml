---
# A bundled site name (no file suffix) must be one of the sites shipped with the cloned byoc-sync.

- name: Check a bundled site name
  when: (byoc_sync_site_config | string | basename | splitext | last) == ''
  block:
    - name: Find the bundled sites
      ansible.builtin.find:
        paths: "{{ byoc_sync_src_dir }}/src/byoc_sync/sites"
        patterns: "*.yml"
      register: _byoc_sync_sites
      check_mode: false

    - name: Stop on an unknown bundled site
      ansible.builtin.fail:
        msg: >-
          byoc_sync_site_config: no bundled site '{{ byoc_sync_site_config }}' in byoc-sync
          (bundled: {{ _byoc_sync_site_names | join(', ') }})
      vars:
        _byoc_sync_site_names: >-
          {{ _byoc_sync_sites.files | map(attribute='path') | map('basename') | map('splitext') | map('first') | sort }}
      # In check mode on a fresh host nothing has been cloned yet.
      when: _byoc_sync_site_names | length > 0 and byoc_sync_site_config not in _byoc_sync_site_names
