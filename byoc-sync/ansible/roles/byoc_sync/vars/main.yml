---
# Internal values of the byoc_sync role. Change role variables (defaults/main.yml), not these.

# Packages, Python and cron per platform. Keys: "<distribution>-<major version>" (EL) or "Ubuntu-<version>".
_byoc_sync_platforms:
  Rocky-9: &el9
    packages: [acl, git, python3.12, util-linux]
    python: python3.12
    cron_package: cronie
    cron_service: crond
  AlmaLinux-9: *el9
  Rocky-10: &el10
    packages: [acl, git, python3, util-linux]
    python: python3
    cron_package: cronie
    cron_service: crond
  AlmaLinux-10: *el10
  Ubuntu-22.04: &ubuntu
    packages: [acl, git, python3, python3-venv, util-linux]
    python: python3
    cron_package: cron
    cron_service: cron
  Ubuntu-24.04: *ubuntu

# Minimum versions byoc-sync needs.
_byoc_sync_min_python: "3.10"
_byoc_sync_min_git: "2.31"

# Environment variables byoc_sync_extra_env must not set (shell and loader behaviour, or set by the role itself).
_byoc_sync_reserved_env:
  - PATH
  - IFS
  - HOME
  - ENV
  - BASH_ENV
  - SHELL
  - GALAXY_API_KEY
  - GITHUB_TOKEN
  - BYOC_SYNC_FINGERPRINT_KEY
  - BYOC_SYNC_VAULT_PASSWORD

# Values a byoc-sync run needs (checked by validate.yml when cron is on, and by the wrapper on every run).
_byoc_sync_run_required: >-
  {{ ['byoc_sync_playbook_repo_url']
     + (['byoc_sync_galaxy_url', 'byoc_sync_galaxy_api_key'] if byoc_sync_source == 'api' else [])
     + (['byoc_sync_github_repo', 'byoc_sync_github_token'] if not byoc_sync_dry_run | bool else []) }}
_byoc_sync_install_required:
  - byoc_sync_user
  - byoc_sync_group
  - byoc_sync_repo_url
  - byoc_sync_venv
  - byoc_sync_reports_dir
  - byoc_sync_vault_password

# Names among the given ones whose value is undefined, empty after trimming, or "changeme".
_byoc_sync_run_missing: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for name in _byoc_sync_run_required -%}
  {%- set value = lookup('ansible.builtin.vars', name, default=None) -%}
  {%- if value is none or (value | string | trim | regex_replace('^[\"\']+|[\"\']+$', '') | trim | lower)
        in ['', 'changeme'] -%}
  {%- set ns.out = ns.out + [name] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.out }}

# Environment for byoc-sync: only values that are set; the GitHub token only when publishing.
_byoc_sync_env: >-
  {{ ({'GALAXY_API_KEY': byoc_sync_galaxy_api_key}
      if (byoc_sync_source == 'api' and 'byoc_sync_galaxy_api_key' not in _byoc_sync_run_missing) else {})
     | combine({'GITHUB_TOKEN': byoc_sync_github_token}
               if (not byoc_sync_dry_run | bool and 'byoc_sync_github_token' not in _byoc_sync_run_missing)
               else {})
     | combine({'BYOC_SYNC_FINGERPRINT_KEY': byoc_sync_fingerprint_key}
               if (byoc_sync_fingerprint_key | string | trim) else {})
     | combine(byoc_sync_extra_env) }}

# Owners of the files the role writes, and whether install steps switch to byoc_sync_user
# (tests override these; installers have no reason to).
_byoc_sync_become: true
_byoc_sync_file_owner: "{{ byoc_sync_user }}"
_byoc_sync_wrapper_owner: root
_byoc_sync_wrapper_group: root
# Whether the role touches cron at all (tests switch it off so no real crontab is edited).
_byoc_sync_manage_cron: true

# Whether byoc_sync_github_repo has a real value (it is optional while dry-run is on).
_byoc_sync_github_repo_set: >-
  {{ byoc_sync_github_repo is not none
     and (byoc_sync_github_repo | string | trim | regex_replace('^[\"\']+|[\"\']+$', '') | trim | lower)
     not in ['', 'changeme'] }}
