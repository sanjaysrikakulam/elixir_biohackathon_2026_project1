---
# Pulsar endpoint on an HPC cluster without root: Pulsar runs inside a batch job.
# Runs as your own user on one login node (group "hpc"); nothing needs sudo.

- name: Pulsar in a batch job
  hosts: hpc
  become: false
  vars:
    # The BYOC form's limits: the job's cores and 90% of its memory
    pulsar_max_cores: "{{ pulsar_job_cores }}"
    pulsar_max_mem_gb: "{{ (pulsar_job_mem_gb | int * 0.9) | int }}"
    pulsar_shared_dir: "{{ pulsar_job_local_dir }}"
    pulsar_summary_file: "{{ pulsar_job_dir }}/byoc-connection.yml"
    pulsar_connected_state: "not checked: Pulsar connects when the job starts"
  tasks:
    - name: Check settings
      ansible.builtin.assert:
        that:
          - groups['hpc'] | length == 1
          - pulsar_job_scheduler in ['slurm', 'pbs']
          - pulsar_connection in ['mq', 'relay']
          - pulsar_job_walltime is match('^[0-9]+:[0-9]{2}:[0-9]{2}$')
        fail_msg: One host in "hpc"; set pulsar_job_scheduler (slurm or pbs), pulsar_connection, pulsar_job_walltime as HH:MM:SS.

    - name: Check the RabbitMQ settings
      ansible.builtin.assert:
        that:
          - pulsar_message_queue_url is match('^(py)?amqps?://[^:@/]+:[^@]+@')
        fail_msg: Set pulsar_message_queue_url to pyamqp://USER:PASSWORD@HOST:PORT//VHOST?ssl=1.
      when: pulsar_connection == 'mq'

    - name: Check the relay settings
      ansible.builtin.assert:
        that:
          - pulsar_relay_password | length > 0
          - pulsar_relay_placement == 'own' or pulsar_galaxy_user_id is match('^[0-9a-f]+$')
          - pulsar_relay_placement == 'central' or pulsar_relay_url is match('^https://')
        fail_msg: For the relay, set pulsar_relay_password and pulsar_galaxy_user_id (central) or pulsar_relay_url (own).
      when: pulsar_connection == 'relay'

    - name: Look for the scheduler and a container runtime
      ansible.builtin.shell: |
        echo "submit=$(command -v {{ pulsar_job_submit_command }} || echo none)"
        echo "singularity=$(command -v singularity || echo none)"
        echo "apptainer=$(command -v apptainer || echo none)"
      args:
        executable: /bin/bash
      changed_when: false
      register: _tools

    - name: Check the scheduler and container runtime
      vars:
        _found: "{{ dict(_tools.stdout_lines | map('split', '=', 1)) }}"
      ansible.builtin.assert:
        that:
          - _found.submit != 'none'
          - _found.singularity != 'none' or _found.apptainer != 'none'
        fail_msg: >-
          {{ inventory_hostname }} needs {{ pulsar_job_submit_command }} and apptainer or singularity
          (found {{ _found }}). On some clusters a module must be loaded first.

    - name: Create the Pulsar directories
      ansible.builtin.file:
        path: "{{ pulsar_job_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: ["", bin, logs]

    - name: Install Pulsar in a virtual environment
      ansible.builtin.pip:
        name: "{{ ['pulsar-app==' ~ pulsar_package_version]
                  + (pulsar_optional_dependencies | reject('equalto', 'drmaa') | list) }}"
        virtualenv: "{{ pulsar_job_dir }}/venv"
        virtualenv_command: "{{ pulsar_job_python }} -m venv"

    # Galaxy calls "singularity"
    - name: Add singularity as a name for apptainer
      ansible.builtin.file:
        src: "{{ (_tools.stdout_lines | select('match', '^apptainer=') | first).split('=', 1)[1] }}"
        dest: "{{ pulsar_job_dir }}/bin/singularity"
        state: link
      when: "'singularity=none' in _tools.stdout_lines"

    - name: Write the Pulsar configuration
      ansible.builtin.copy:
        content: "{{ pulsar_job_app_config | to_nice_yaml }}"
        dest: "{{ pulsar_job_dir }}/app.yml"
        mode: "0600"
      # holds the queue or relay password
      no_log: true

    - name: Write the job script
      ansible.builtin.template:
        src: templates/pulsar-job.sh.j2
        dest: "{{ pulsar_job_dir }}/pulsar-job.sh"
        mode: "0700"

    - name: Write the connection summary for the Galaxy BYOC form
      ansible.builtin.template:
        src: templates/byoc-connection.yml.j2
        dest: "{{ pulsar_summary_file }}"
        mode: "0600"

    - name: Read the connection summary
      ansible.builtin.slurp:
        src: "{{ pulsar_summary_file }}"
      register: _summary

    - name: Show the connection summary and how to start Pulsar
      ansible.builtin.debug:
        msg: >-
          {{ (_summary.content | b64decode).splitlines()
             + ['', 'Start Pulsar with: ' ~ pulsar_job_submit_command ~ ' ' ~ pulsar_job_dir ~ '/pulsar-job.sh',
                'Start it only after the Galaxy admins have created your endpoint.'] }}
