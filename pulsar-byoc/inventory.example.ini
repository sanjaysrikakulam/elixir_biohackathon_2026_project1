# Copy to inventory.ini. One host in [pulsar]; list it under [workers] too to run jobs on it.
[pulsar]
pulsar01 ansible_host=10.0.0.10

[workers]
worker01 ansible_host=10.0.0.11
worker02 ansible_host=10.0.0.12

# rootless.yml only: one login node of an HPC cluster, used as your own user
# [hpc]
# login.hpc.example.org ansible_user=<your cluster username>

[all:vars]
ansible_user=ubuntu
