---
- name: Install the information page
  when: pulsar_info_page_install | bool
  block:
    - name: Create the information page user
      ansible.builtin.user:
        name: "{{ pulsar_info_page_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Install what the information page needs
      ansible.builtin.package:
        name: "{{ pulsar_info_page_packages[ansible_os_family] }}"
        state: present

    - name: Create the information page directory
      ansible.builtin.file:
        path: "{{ pulsar_info_page_dir }}"
        state: directory
        owner: root
        group: "{{ pulsar_info_page_user }}"
        mode: "0750"

    # From this repository; state.json holds per-host values and is written below
    - name: Copy the information page
      ansible.posix.synchronize:
        src: "{{ pulsar_info_page_src }}"
        dest: "{{ pulsar_info_page_dir }}/"
        rsync_opts:
          - "--exclude=app/state.json"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--chown=root:{{ pulsar_info_page_user }}"
          - "--chmod=D750,F640"
      register: _info_page_copy
      # synchronize reports a change on every run; rsync lists files only when they changed
      changed_when: _info_page_copy.msg | default('') | length > 0
      notify: Restart the information page

    - name: Install the information page's Python packages
      ansible.builtin.pip:
        requirements: "{{ pulsar_info_page_dir }}/requirements.txt"
        virtualenv: "{{ pulsar_info_page_dir }}/.venv"
        virtualenv_command: /usr/bin/python3 -m venv
      notify: Restart the information page

    - name: Install the information page service
      ansible.builtin.template:
        src: templates/pulsar-info.service.j2
        dest: "/etc/systemd/system/{{ pulsar_info_page_service }}.service"
        owner: root
        group: root
        mode: "0644"
      notify: Restart the information page

    - name: Start the information page
      ansible.builtin.systemd:
        name: "{{ pulsar_info_page_service }}.service"
        state: started
        enabled: true
        daemon_reload: true

- name: Write the values the page shows
  ansible.builtin.include_tasks: info_page_state.yml
