---
# Page that shows the user what to enter in Galaxy's BYOC form (../fastapi-resenv).
# It has no login and shows the password, so it listens on localhost; an
# authenticating proxy exposes it. info-page.yml sets it up on its own, before
# Pulsar; it shows INCOMPLETE until Pulsar runs.
pulsar_info_page: true
# false on images where the page is already installed (SimpleVM resenv,
# ../pulsar-fastapi-deploy): then only the values are written
pulsar_info_page_install: true
pulsar_info_page_src: "{{ playbook_dir }}/../fastapi-resenv/"
pulsar_info_page_unit_template: "{{ playbook_dir }}/../pulsar-fastapi-deploy/pulsar-resenv.service.j2"
# Same names and paths as the SimpleVM resenv
pulsar_info_page_dir: /opt/pulsar-fastapi-resenv
pulsar_info_page_user: pulsar-resenv
pulsar_info_page_service: pulsar-resenv
# SimpleVM sets 0.0.0.0: its FORC proxy runs on another host
pulsar_info_page_host: 127.0.0.1
pulsar_info_page_port: 8080
pulsar_info_page_packages:
  Debian: [python3-venv, rsync]
  RedHat: [python3, rsync]

# Values shown on the page
pulsar_info_page_username: >-
  {{ pulsar_endpoint_name if pulsar_connection == 'mq' else pulsar_relay_username_final }}
pulsar_info_page_password: >-
  {{ pulsar_message_queue_url | urlsplit('password') if pulsar_connection == 'mq' else pulsar_relay_password }}
